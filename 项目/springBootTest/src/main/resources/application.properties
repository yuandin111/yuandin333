spring.application.name=springBootTest
spring.profiles.active=dev

# ===== image upload (/api/admin/upload) =====
# Spring Boot default max-file-size is only 1MB, raise to 5MB (matches FileUploadController check)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# 日志级别：全局 info，业务包 warn
logging.level.root=info
logging.level.com.fenglin.springboottest=warn
# 日志输出到文件
logging.file.name=log/xx.log
# 控制台日志格式
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n
# 文件日志格式
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n