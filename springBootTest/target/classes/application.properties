spring.application.name=springBootTest
spring.profiles.active=dev

# ============================================================
# Web
# context-path=/api  ->  所有接口统一带 /api 前缀
# 前端 fanren-login-vue 的 .env 中 VITE_API_BASE=http://localhost:8081/api
# ============================================================
server.servlet.context-path=/api

# ============================================================
# Logging
# ============================================================
logging.level.root=info
logging.level.com.fenglin.springboottest=debug
logging.file.name=log/xx.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n

# ============================================================
# JWT（登录令牌）
# secret 至少 32 个字符（HS256 要求密钥 >= 256 bit），上线前务必更换
# ============================================================
jwt.secret=fanren-login-secret-key-please-change-in-production-2026
jwt.expiration-hours=168

# ============================================================
# Jackson（日期序列化）
# ============================================================
spring.jackson.time-zone=GMT+8
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
