server.port=8081

# ===== MySQL 数据源 =====
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/springboot_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ===== MyBatis-Plus =====
# 实体扫描别名包
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
# 控制台打印 SQL 日志
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 主键自增策略（数据库自增）
mybatis-plus.global-config.db-config.id-type=auto
# 逻辑删除未启用，表名前缀无
mybatis-plus.global-config.banner=false
